<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEEEC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="わが家の家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

</head>
<body>
<title>わが家の家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 手帳の1ページ。上に「いま誰がいくら」の一文、下に明細。数字は細身の欧文、文字は角ゴシック */
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --surface-2:#F3F5F3; --ink:#161A1D; --ink-2:#56606A; --ink-3:#8A939A; --line:#D7DCD9;
  --accent:#0B6E7F; --accent-ink:#FFFFFF; --accent-soft:#DCEEF1;
  --good:#1B7A45; --good-soft:#DBF0E2; --owe:#B5442B; --owe-soft:#F8E3DC; --warn:#9A620C; --warn-soft:#F7EBD4;
  --scrim:rgba(14,17,19,.42);
  --shadow:0 1px 2px rgba(20,24,28,.06),0 6px 18px rgba(20,24,28,.05);
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --tab-h:62px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15191D; --surface:#21272C; --surface-2:#2D343A; --ink:#F5F7F6; --ink-2:#C6CDD2; --ink-3:#9BA5AC; --line:#434C53;
    --accent:#6FCBDB; --accent-ink:#06171B; --accent-soft:#1E3F47;
    --good:#62D393; --good-soft:#1D3D2A; --owe:#FF9A80; --owe-soft:#4A2A22; --warn:#F2BA58; --warn-soft:#433312;
    --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15191D; --surface:#21272C; --surface-2:#2D343A; --ink:#F5F7F6; --ink-2:#C6CDD2; --ink-3:#9BA5AC; --line:#434C53;
  --accent:#6FCBDB; --accent-ink:#06171B; --accent-soft:#1E3F47;
  --good:#62D393; --good-soft:#1D3D2A; --owe:#FF9A80; --owe-soft:#4A2A22; --warn:#F2BA58; --warn-soft:#433312;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.label{font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:500}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 8px}
.top h1{font-size:19px;font-weight:700;flex:1}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin-right:6px;vertical-align:1px}
.syncdot.ok{background:var(--good)}.syncdot.warn{background:var(--warn)}
.syncline{font-size:12.5px;border-radius:10px;padding:8px 12px;margin-bottom:10px;background:var(--warn-soft);color:var(--ink)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;flex-wrap:wrap}
.banner b{color:var(--warn)}

/* hero: 残高の一文 */
.hero{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hero .who{font-size:14px;color:var(--ink-2);font-weight:500}
.hero .who b{color:var(--ink);font-weight:700}
.hero .amt{font-family:var(--f-num);font-weight:700;font-size:58px;line-height:.95;font-variant-numeric:tabular-nums}
.hero.pos .amt{color:var(--good)} .hero.neg .amt{color:var(--owe)}
.hero .sub{font-size:12.5px;color:var(--ink-2)}
.hero-row{display:flex;gap:8px;flex-wrap:wrap}

.section{margin-top:22px}
.section>h2{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.kv>div{padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.kv>div+div{border-left:1px solid var(--line)}
.kv .v{font-family:var(--f-num);font-weight:700;font-size:clamp(18px,5.6vw,24px);line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 14px;border-radius:11px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink);text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--owe-soft);color:var(--owe)}
.btn.block{width:100%}.btn.grow{flex:1}.btn.sm{height:34px;font-size:13px;padding:0 11px}
.btn:disabled{opacity:.45}
.linkish{font-size:12.5px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}

.list{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;min-height:54px;text-align:left;width:100%}
.li+.li{border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0}
.li .t{display:block;font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.li .s{display:block;font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.li:active{background:var(--surface-2)}
.li.del .t{text-decoration:line-through;color:var(--ink-3)}
.day{width:34px;flex:none;text-align:center;line-height:1.05}
.day b{display:block;font-family:var(--f-num);font-size:22px;font-weight:700}
.day span{font-size:10.5px;color:var(--ink-2)}
.catdot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--ink-3));flex:none;display:inline-block;margin-right:5px;vertical-align:0}
.amtcol{text-align:right;flex:none;line-height:1.2}
.amtcol small{display:block;font-size:10.5px;color:var(--ink-2);letter-spacing:.04em}
.amtcol b{font-family:var(--f-num);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.lent b{color:var(--good)} .borrow b{color:var(--owe)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:0 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.n{background:var(--surface-2);color:var(--ink-2)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.mhead .num{font-size:16px;color:var(--ink)}
.empty{text-align:center;color:var(--ink-2);padding:26px 14px;background:var(--surface);border-radius:16px;border:1px dashed var(--line)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.fchip{flex:none;font-size:13px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
input.plain,select.plain,textarea.plain{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:0 12px;font-size:16px;min-width:0}
textarea.plain{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
input.plain:focus,select.plain:focus,textarea.plain:focus{outline:none;border-color:var(--accent)}
input.numin{font-family:var(--f-num);font-weight:600;font-size:21px;text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));z-index:7;height:52px;padding:0 20px 0 14px;border-radius:26px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.fab svg{width:22px;height:22px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink-2);font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;z-index:21;padding-inline:16px;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-8px;background:var(--bg);padding-block:6px;z-index:2}
.sheet-head h2{font-size:17px;flex:1}
.form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:500;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.amtrow{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px}
.amtrow input{height:56px;font-size:32px}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2);padding:2px 6px;overflow-wrap:anywhere}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.splitbox{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px;align-items:center}
.srow.chk{grid-template-columns:24px minmax(0,1fr)}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.irow{display:grid;grid-template-columns:minmax(0,1.2fr) 86px 92px 30px;gap:6px;align-items:center}
.irow input.plain,.irow select.plain{height:40px;padding:0 8px;font-size:15px}
.preview{font-size:13px;border-radius:10px;padding:8px 10px;background:var(--accent-soft);color:var(--ink)}
.preview.err{background:var(--owe-soft);color:var(--owe);font-weight:700}
.preview b{font-family:var(--f-num);font-size:17px}
.bigamt{font-family:var(--f-num);font-weight:700;font-size:48px;line-height:1}
.brk{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:baseline;font-size:13px}
.brk b{font-family:var(--f-num);font-size:18px;text-align:right}
.cm{background:var(--surface);border-radius:12px;padding:8px 12px;font-size:14px}
.cm small{display:block;color:var(--ink-2);font-size:11.5px}
.rcpt{display:block;width:100%;border-radius:12px}
.confirm-box{display:flex;flex-direction:column;gap:14px;padding-block:6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.switch+.switch{border-top:1px solid var(--line)}

/* 月次 */
.monthnav{flex:1;display:flex;align-items:center;justify-content:center;gap:4px}
.monthnav .m{font-family:var(--f-num);font-weight:700;font-size:28px;line-height:1;min-width:120px;text-align:center}
.settle{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);box-shadow:var(--shadow)}
.settle .big{font-family:var(--f-num);font-weight:700;font-size:40px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:99px}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.todo{background:var(--warn-soft);color:var(--warn)}
.pill svg{width:12px;height:12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px;align-items:baseline}
.bar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.bar b{font-family:var(--f-num);font-size:16px}
.bar.bud .track{position:relative;height:10px;border-radius:5px}
.bar.bud .track i.warn{background:var(--warn)} .bar.bud .track i.over{background:var(--owe)}
.bar.bud .track u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);margin-left:-1px}
.bar.bud .note{grid-column:1/-1;font-size:12px;color:var(--ink-2)}
.pill.over{background:var(--owe-soft);color:var(--owe)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-num);font-size:10.5px;fill:var(--ink-2)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--ink-3)} .chart .b.on{fill:var(--accent)}
.chart .vl{font-size:12.5px;font-weight:700;fill:var(--ink)}
.chart g[data-act]{cursor:pointer}
.auth{max-width:400px;margin:0 auto;padding-block:48px 24px;display:flex;flex-direction:column;gap:16px}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.auth-logo h1{font-size:24px;font-weight:700;letter-spacing:.04em}
.auth-msg{font-size:13px;color:var(--owe);background:var(--owe-soft);border-radius:10px;padding:8px 10px}
.auth-msg.ok{color:var(--ink-2);background:var(--surface-2)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
textarea.dump{width:100%;height:180px;font-size:12px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
@media (max-width:380px){.hero .amt{font-size:48px}.irow{grid-template-columns:minmax(0,1fr) 72px 84px 26px}}
</style>

<div class="wrap" id="main"></div>
<div id="fabhost"></div>
<nav class="tabbar" id="tabbar" aria-label="メイン" hidden>
  <div class="tabbar-in">
    <button class="tab" data-act="go" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg>ホーム</button>
    <button class="tab" data-act="go" data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>明細</button>
    <button class="tab" data-act="go" data-v="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>月次</button>
    <button class="tab" data-act="go" data-v="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>履歴</button>
    <button class="tab" data-act="go" data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
  </div>
</nav>

<script>
(()=>{
'use strict';
const NS='wagayakakei';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>fmtDate(new Date());
const WD='日月火水木金土';
const ymLabel=m=>{const[y,mo]=m.split('-');return `${y}年${+mo}月`};
const addMonth=(m,n)=>{let[y,mo]=m.split('-').map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return `${y}-${pad(mo)}`};
const z2h=s=>String(s??'').replace(/[０-９．，－]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
const CUR={JPY:{s:'¥',d:0},USD:{s:'$',d:2},EUR:{s:'€',d:2},GBP:{s:'£',d:2},KRW:{s:'₩',d:0},TWD:{s:'NT$',d:0},THB:{s:'฿',d:2},AUD:{s:'A$',d:2},CNY:{s:'CN¥',d:2},HKD:{s:'HK$',d:2},SGD:{s:'S$',d:2}};
const cinfo=c=>CUR[c]||{s:c+' ',d:2};
const fmt=(minor,cur='JPY')=>{const c=cinfo(cur),v=(minor||0)/10**c.d;return (v<0?'−':'')+c.s+Math.abs(v).toLocaleString('ja-JP',{minimumFractionDigits:c.d,maximumFractionDigits:c.d})};

/* ---------- 按分の計算（最小通貨単位の整数で持つ） ---------- */
function distribute(total,w,ids){
  const sum=ids.reduce((s,i)=>s+(+w[i]||0),0);if(!(sum>0))return null;
  const out={};let used=0;const fr=[];
  ids.forEach(i=>{const raw=total*(+w[i]||0)/sum,f=Math.floor(raw+1e-9);out[i]=f;used+=f;fr.push([raw-f,i])});
  fr.sort((x,y)=>y[0]-x[0]);let left=total-used;for(let k=0;left>0;k++,left--)out[fr[k%fr.length][1]]++;
  return out;
}
function calcOwed(amt,sp,ratio){
  const ids=MID(),v=sp.v||{},zero=()=>Object.fromEntries(ids.map(i=>[i,0]));
  const sumv=()=>ids.reduce((s,i)=>s+(+v[i]||0),0);
  if(ids.some(i=>isNaN(+(v[i]??0))))return {err:'数字を入力してください'};
  switch(sp.mode){
    case 'default':return {owed:distribute(amt,ratio,ids)};
    case 'equal':{const inc=ids.filter(i=>v[i]!==0);if(!inc.length)return {err:'負担する人を選んでください'};const w={};inc.forEach(i=>w[i]=1);return {owed:Object.assign(zero(),distribute(amt,w,inc))}}
    case 'percent':{const s=sumv();if(Math.abs(s-100)>.001)return {err:`合計が ${Math.round(s*100)/100}% です。100% にしてください`};return {owed:distribute(amt,v,ids)}}
    case 'shares':{if(!(sumv()>0))return {err:'シェアの数を入力してください'};return {owed:distribute(amt,v,ids)}}
    case 'exact':{const s=sumv();if(s!==amt)return {err:s<amt?`あと ${fmt(amt-s,sp.cur)} 足りません`:`${fmt(s-amt,sp.cur)} 多すぎます`};return {owed:Object.assign(zero(),v)}}
    case 'adjust':{const s=sumv();if(s>amt)return {err:'調整額の合計が金額を超えています'};const w={};ids.forEach(i=>w[i]=1);const b=distribute(amt-s,w,ids)||zero();const o={};ids.forEach(i=>o[i]=b[i]+(+v[i]||0));return {owed:o}}
    case 'items':{const o=zero();let rest=amt;for(const it of sp.items||[]){const a=+it.amt||0;if(!a)continue;rest-=a;let d;if(it.w==='def')d=distribute(a,ratio,ids);else if(it.w==='half'){const w={};ids.forEach(i=>w[i]=1);d=distribute(a,w,ids)}else{d=zero();d[it.w]=a}ids.forEach(i=>o[i]+=d[i])}
      if(rest<0)return {err:`品目の合計が ${fmt(-rest,sp.cur)} 多すぎます`};
      if(rest>0){const d=distribute(rest,ratio,ids);ids.forEach(i=>o[i]+=d[i])}
      return {owed:o,rest}}
  }
  return {err:'分け方を選んでください'};
}
function splitTag(e){
  if(e.pay)return '';const m=e.sp?.mode;
  if(m==='default')return '';
  if(m==='equal'){const inc=MID().filter(i=>e.sp.v?.[i]!==0);return inc.length===MID().length?'<span class="tag">5:5</span>':`<span class="tag">${esc(nm(inc[0]))}のみ</span>`}
  return `<span class="tag">${{percent:'％指定',shares:'シェア',exact:'金額指定',adjust:'調整',items:'品目ごと'}[m]||'個別'}</span>`;
}

/* ---------- クラウド（Supabase REST） ---------- */
class NetErr extends Error{} class AuthErr extends Error{}
const baseUrl=()=>cfg.url.replace(/\/+$/,'');
async function http(path,opt){let res;try{res=await fetch(baseUrl()+path,opt)}catch(e){throw new NetErr('offline')}const t=await res.text();let json=null;try{json=t?JSON.parse(t):null}catch(e){}return {status:res.status,json}}
const authHeaders=()=>({apikey:cfg.key,'Content-Type':'application/json'});
function setSession(j,user){ses={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:+j.expires_at||Math.floor(Date.now()/1000)+(+j.expires_in||3600),user:{id:(user||j.user).id,email:(user||j.user).email}};lsSet(SES_KEY,ses)}
let refreshing=null;
async function token(force){
  if(!ses)throw new AuthErr('nosession');
  if(!force&&ses.expires_at-60>Date.now()/1000)return ses.access_token;
  if(!refreshing)refreshing=(async()=>{
    const r=await http('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:authHeaders(),body:JSON.stringify({refresh_token:ses.refresh_token})});
    if(r.status===200&&r.json&&r.json.access_token){setSession(r.json);return}
    if(r.status>=400&&r.status<500)throw new AuthErr('expired');
    throw new Error('トークン更新に失敗（HTTP '+r.status+'）');
  })().finally(()=>{refreshing=null});
  await refreshing;return ses.access_token;
}
async function rest(method,path,body,prefer,retried){
  const h={apikey:cfg.key,Authorization:'Bearer '+await token(),'Content-Type':'application/json'};if(prefer)h.Prefer=prefer;
  const r=await http('/rest/v1/'+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  if(r.status===401&&!retried){await token(true);return rest(method,path,body,prefer,true)}
  if(r.status===401)throw new AuthErr('expired');
  return r;
}
const errMsg=r=>'HTTP '+r.status+(r.json&&r.json.message?' '+r.json.message:'');
async function pull(){
  let changed=false;
  for(let page=0;page<60;page++){
    const r=await rest('GET','wagayakakei_docs?select=id,kind,data,updated_at&kind=neq.receipt&order=updated_at.asc,id.asc&limit=1000'+(cursor?'&updated_at=gte.'+encodeURIComponent(cursor):''));
    if(r.status!==200)throw new Error(errMsg(r));
    const rows=r.json||[];
    for(const row of rows){if(dirty[row.id])continue;const c=docs.get(row.id);if(!c||JSON.stringify(c.d)!==JSON.stringify(row.data)){docs.set(row.id,{k:row.kind,d:row.data});changed=true;catMemo=null}}
    const last=rows.length?rows[rows.length-1].updated_at:cursor,adv=last!==cursor;cursor=last;
    if(rows.length<1000||!adv)break;
  }
  return changed;
}
async function push(){
  const ids=Object.keys(dirty).filter(id=>docs.has(id));if(!ids.length)return;
  for(let i=0;i<ids.length;i+=100){
    const chunk=ids.slice(i,i+100),snap={};chunk.forEach(id=>snap[id]=dirty[id]);
    const r=await rest('POST','wagayakakei_docs?on_conflict=id',chunk.map(id=>({id,kind:docs.get(id).k,data:docs.get(id).d})),'resolution=merge-duplicates,return=minimal');
    if(r.status<200||r.status>=300)throw new Error(errMsg(r));
    chunk.forEach(id=>{if(dirty[id]===snap[id])delete dirty[id]});
  }
}
let busy=false,again=false,pushT=null;
function schedulePush(ms=900){if(st.demo||!ses)return;clearTimeout(pushT);pushT=setTimeout(syncNow,ms)}
async function syncNow(){
  if(st.demo||!ses||st.screen==='login')return;
  if(busy){again=true;return}
  busy=true;setSync('syncing');
  try{await push();const ch=await pull();st.pulled=true;persistNow();sync.last=Date.now();setSync(Object.keys(dirty).length?'syncing':'synced');afterSync(ch)}
  catch(e){if(e instanceof NetErr)setSync('offline');else if(e instanceof AuthErr)sessionExpired();else setSync('error',e.message||String(e))}
  finally{busy=false}
  if(again){again=false;return syncNow()}
}
function setSync(s,msg=''){sync.state=s;sync.msg=msg;$$('[data-sync]').forEach(el=>el.innerHTML=syncHTML(el.dataset.sync))}
function syncHTML(kind){
  const s=sync.state;
  if(kind==='line'){
    if(st.demo)return '';
    if(s==='offline')return `<div class="syncline">オフライン。入力はこの端末に保存し、つながったら自動で送ります</div>`;
    if(s==='error')return `<div class="syncline">同期できませんでした：${esc(sync.msg)} <button class="linkish" data-act="syncNow">再試行</button></div>`;
    return '';
  }
  const L={idle:'—',syncing:'同期中…',synced:'同期済み',offline:'オフライン（未送信あり）',error:'エラー：'+esc(sync.msg)};
  const cls=s==='synced'?'ok':(s==='syncing'||s==='idle')?'':'warn';
  return `<span class="syncdot ${cls}"></span>${L[s]||s}${sync.last&&s==='synced'?`<span class="muted">（${new Date(sync.last).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}）</span>`:''}`;
}
function afterSync(changed){
  if(st.screen==='loading'){st.screen='app';render()}
  else if(changed&&st.screen==='app')renderMain();
  onboard();
}
function onboard(){
  if(st.demo||st.screen!=='app'||!st.pulled)return;
  if(!conf()){if(st.sheet?.type!=='setup')openSheet({type:'setup'});return}
  if(!members().some(m=>m.uid===ses.user.id)){if(st.sheet?.type!=='who')openSheet({type:'who'});return}
  runRecurring();
}
function sessionExpired(){ses=null;lsSet(SES_KEY,null);st.screen='login';st.authMsg='ログインの有効期限が切れました。もう一度ログインしてください（未送信の入力は消えていません）';st.authOk=false;st.sheet=null;render()}
async function login(email,password){
  const r=await http('/auth/v1/token?grant_type=password',{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password})});
  if(r.status===200&&r.json&&r.json.access_token){setSession(r.json);return null}
  if(r.status===400||r.status===401)return 'メールアドレスかパスワードが違います';
  if(r.status===429)return '試行回数が多すぎます。少し待ってからお試しください';
  return 'ログインできませんでした（HTTP '+r.status+'）';
}
async function logout(){
  try{if(ses)await http('/auth/v1/logout',{method:'POST',headers:{apikey:cfg.key,Authorization:'Bearer '+ses.access_token}})}catch(e){}
  if(ses&&!Object.keys(dirty).length)lsSet(dataKey(),null);
  ses=null;lsSet(SES_KEY,null);docs.clear();dirty={};cursor='';st.pulled=false;st.screen='login';st.authMsg='ログアウトしました';st.authOk=true;st.sheet=null;render();
}

    if(r.status===200&&Array.isArray(r.json)&&!r.json.length){st.screen='nomember';st.authMsg='このアカウントは利用者として登録されていません。setup.sql の最後の INSERT 文にこのメールアドレスを入れて実行してください。';render();return}
  }catch(e){if(e instanceof AuthErr){sessionExpired();return}}
  syncNow();
}
async function handleAuthHash(){
  const h=location.hash;if(!h||h.indexOf('access_token=')<0)return false;
  const p=new URLSearchParams(h.slice(1));try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(!cfg)return false;
  try{
    const r=await http('/auth/v1/user',{headers:{apikey:cfg.key,Authorization:'Bearer '+p.get('access_token')}});if(r.status!==200)throw 0;
    setSession({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:p.get('expires_at'),expires_in:p.get('expires_in')},r.json);
    if(p.get('type')==='recovery'||p.get('type')==='invite'){st.screen='newpass';render();return true}
  }catch(e){st.authMsg='リンクの有効期限が切れています'}
  return false;
}

  return r.status===200?null:((r.json&&(r.json.msg||r.json.message))||('HTTP '+r.status));
}

/* ---------- 集計 ---------- */
function monthList(m,cur){return live().filter(e=>e.cur===cur&&(e.pay?e.mon===m:e.date.slice(0,7)===m))}
function monthNet(m,cur){const o={};MID().forEach(i=>o[i]=0);monthList(m,cur).forEach(e=>{const n=net(e);MID().forEach(i=>o[i]+=n[i])});return o}
function monthStat(m,cur){
  const l=live().filter(e=>!e.pay&&e.cur===cur&&e.date.slice(0,7)===m),s={total:0,n:l.length,paid:{},owed:{},cat:{}};
  MID().forEach(i=>{s.paid[i]=0;s.owed[i]=0});
  l.forEach(e=>{s.total+=e.amt;MID().forEach(i=>{s.paid[i]+=e.paid?.[i]||0;s.owed[i]+=e.owed?.[i]||0});s.cat[e.cat]=(s.cat[e.cat]||0)+e.amt});
  return s;
}
const whoOwes=(n,cur)=>{const m=me(),o=other(),v=n[m]||0;if(!v)return null;return v>0?{from:o,to:m,amt:v,cur}:{from:m,to:o,amt:-v,cur}};
function unsettledMonths(cur){const s=new Set();live().forEach(e=>{if(e.cur===cur)s.add(e.pay?e.mon:e.date.slice(0,7))});s.delete(undefined);s.delete('');return [...s].filter(m=>m&&monthNet(m,cur)[me()]!==0).sort()}

function nextDate(d,every){const t=parseDate(d);if(every==='week')t.setDate(t.getDate()+7);else if(every==='2week')t.setDate(t.getDate()+14);else if(every==='year')t.setFullYear(t.getFullYear()+1);else{const day=t.getDate();t.setDate(1);t.setMonth(t.getMonth()+1);t.setDate(Math.min(day,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()))}return fmtDate(t)}
function runRecurring(){
  const today=todayStr();let made=0;
  all('rec').forEach(r=>{if(!r.on||!r.next)return;let next=r.next,guard=0;
    while(next<=today&&guard++<60){const id='x_'+r.id.replace(/^rec_/,'r')+'_'+next.replace(/-/g,'');if(!docs.has(id)){put(id,'x',Object.assign({},r.tpl,{date:next,rid:r.id,by:r.tpl.by||me(),at:Date.now(),cm:[]}));made++}next=nextDate(next,r.every)}
    if(next!==r.next)put(r.id,'rec',Object.assign({},r,{next}));
  });
  if(made){toast(`繰り返しの支出を ${made} 件追加しました`);renderMain()}
}

function newDraft(e,o={}){
  const g=e?get(e.g):(get(o.g)||get(lsGet(NS+'-lastg'))||liveGroups()[0]),cur=e?.cur||g?.cur||'JPY',ids=MID();
  const d={id:o.copy?null:e?.id,g:e?.g||g?.id||'',desc:e?.desc||'',amtS:e?fromMinor(e.amt,cur):'',cur,date:o.copy?todayStr():(e?.date||todayStr()),cat:e?.cat||(baseCats().includes('食費')?'食費':baseCats()[0]||'その他'),note:e?.note||'',payer:me(),paidS:{},mode:'default',v:{},inc:{},items:[],rep:'',src:o.copy?null:e,img:null};
  ids.forEach(i=>{d.paidS[i]='';d.v[i]='';d.inc[i]=true});
  if(e){const ps=ids.filter(i=>e.paid?.[i]>0);if(ps.length>1){d.payer='multi';ids.forEach(i=>d.paidS[i]=fromMinor(e.paid[i]||0,cur))}else d.payer=ps[0]||me();
    const sp=e.sp||{mode:'default'};d.mode=sp.mode;
    if(sp.mode==='equal')ids.forEach(i=>d.inc[i]=sp.v?.[i]!==0);
    else if(sp.mode==='exact'||sp.mode==='adjust')ids.forEach(i=>d.v[i]=fromMinor(sp.v?.[i]||0,cur));
    else if(sp.mode==='percent'||sp.mode==='shares')ids.forEach(i=>d.v[i]=String(sp.v?.[i]??''));
    else if(sp.mode==='items')d.items=(sp.items||[]).map(it=>({n:it.n,amtS:fromMinor(it.amt,cur),w:it.w}));}
  return d;
}
function draftCalc(d){
  const ids=MID(),cur=d.cur,amt=toMinor(d.amtS,cur),g=get(d.g),ratio=d.src&&d.src.g===d.g&&d.src.sp?.r?d.src.sp.r:gRatio(g);
  if(amt==null||!(amt>0))return {err:'金額を入力してください'};
  let paid={};
  if(d.payer==='multi'){let s=0;for(const i of ids){const p=toMinor(d.paidS[i],cur)||0;if(p<0)return {err:'支払額を確認してください'};paid[i]=p;s+=p}if(s!==amt)return {err:`支払額の合計が ${fmt(s,cur)} です。${fmt(amt,cur)} にしてください`}}
  else paid={[d.payer]:amt};
  const sp={mode:d.mode,v:{},r:ratio,cur};
  if(d.mode==='equal')ids.forEach(i=>sp.v[i]=d.inc[i]?1:0);
  else if(d.mode==='exact'||d.mode==='adjust')ids.forEach(i=>sp.v[i]=toMinor(d.v[i],cur)||0);
  else if(d.mode==='percent'||d.mode==='shares')ids.forEach(i=>sp.v[i]=numOf(d.v[i]));
  else if(d.mode==='items')sp.items=d.items.map(it=>({n:it.n,amt:toMinor(it.amtS,cur)||0,w:it.w})).filter(it=>it.amt||it.n);
  const r=calcOwed(amt,sp,ratio);if(r.err)return {err:r.err};delete sp.cur;
  return {amt,paid,sp,owed:r.owed,rest:r.rest,ratio};
}

function csvOf(list){
  const ids=MID(),q=s=>/[",\n]/.test(String(s))?'"'+String(s).replace(/"/g,'""')+'"':String(s),n=(v,c)=>(v/10**cinfo(c).d).toFixed(2);
  const rows=[['Date','Description','Category','Cost','Currency',...ids.map(nm)]];
  list.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.at||0)-(b.at||0)).forEach(e=>{const t=net(e);rows.push([e.date,e.pay?`${nm(ids.find(i=>e.paid?.[i]>0))} paid ${nm(ids.find(i=>e.owed?.[i]>0))}`:e.desc,e.pay?'Payment':e.cat,n(e.amt,e.cur),e.cur,...ids.map(i=>n(t[i],e.cur))])});
  const b=balances(list);Object.keys(b).forEach(c=>rows.push([todayStr(),'Total balance','','',c,...ids.map(i=>n(b[c][i]||0,c))]));

function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
function readImport(text,fname){
  const rows=parseCSV(text),hi=rows.findIndex(r=>r.length>=6&&/^(date|日付)$/i.test(r[0].trim()));
  if(hi<0)return toast('Splitwise の CSV として読めませんでした');
  const names=rows[hi].slice(5).map(s=>s.trim()).filter(Boolean);if(names.length!==2)return toast(`メンバーが ${names.length} 人の CSV です。2人のグループだけ取り込めます`);
  const out=[];rows.slice(hi+1).forEach(r=>{const date=r[0].trim().slice(0,10),desc=(r[1]||'').trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||/^total balance$/i.test(desc)||desc==='合計残高')return;const cost=Number(r[3]);if(!isFinite(cost)||!cost)return;out.push({date,desc,cat:(r[2]||'').trim(),cost,cur:(r[4]||'JPY').trim().toUpperCase(),nets:[Number(r[5])||0,Number(r[6])||0]})});
  if(!out.length)return toast('取り込める明細がありませんでした');
  out.sort((a,b)=>a.date.localeCompare(b.date));

}

    else{const owed={[oth]:Math.max(0,-nets[oth]),[payer]:amt-Math.max(0,-nets[oth])};let sp={mode:'exact',v:owed,r:ratio};const d=distribute(amt,ratio,ids),h=distribute(amt,{[ids[0]]:1,[ids[1]]:1},ids);

async function shrink(file){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=url});const k=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.62)}finally{URL.revokeObjectURL(url)}}

    const sc=o=>{const w={};ids.forEach(i=>w[i]=o?.[i]||0);return distribute(amt,w,ids)||{}};const note=(e.note?e.note+'\n':'')+`元の金額 ${fmt(e.amt,e.cur)}（1 ${e.cur} = ${r} 円）`;
    const paid=sc(e.paid),owed=e.pay?sc(e.owed):sc(e.owed);saveX(Object.assign(e,{amt,cur:'JPY',paid,owed,note,sp:e.pay?undefined:{mode:'exact',v:owed,r:e.sp?.r}}),'conv');openSheet({type:'detail',id:e.id});renderMain()},
  async loadImg(el){const id='r_'+el.dataset.id,box=$('#rc');let d=docs.get(id)?.d;box.innerHTML='<p class="small muted">読み込み中…</p>';
    if(!d&&!st.demo){try{const r=await rest('GET','wagayakakei_docs?select=data&id=eq.'+encodeURIComponent(id));d=r.json?.[0]?.data}catch(e){}}
    box.innerHTML=d?.img?`<img class="rcpt" alt="レシートの写真" src="${d.img}">`:'<p class="small muted">写真を読み込めませんでした</p>'},
  payer(el){const d=st.sheet.d;d.payer=el.dataset.id;renderSheet()},
  spTop(el){const d=st.sheet.d,k=el.dataset.id;if(k==='def')d.mode='default';else if(k==='half'){d.mode='equal';MID().forEach(i=>d.inc[i]=true)}else{d.mode='items';if(!d.items.length)d.items=[{n:'',amtS:'',w:'half'}]}refreshSplit()},
  itAdd(){st.sheet.d.items.push({n:'',amtS:'',w:'def'});refreshSplit();$('#it_n'+(st.sheet.d.items.length-1))?.focus()},
  itDel(el){st.sheet.d.items.splice(+el.dataset.i,1);refreshSplit()},
  openSettle(el){openSettle(el.dataset.m,el.dataset.cur)},
  paySwap(){const s=st.sheet;[s.from,s.to]=[s.to,s.from];s.amtS=$('#payAmt').value;renderSheet()},
  newGroup(){openSheet({type:'group',id:null})},
  openGroup(el){openSheet({type:'group',id:el.dataset.id})},
  archG(el){const g=get(el.dataset.id);put(g.id,'g',Object.assign(g,{arch:!g.arch}));closeSheet();renderMain()},
  askDelG(el){const n=xs().filter(e=>e.g===el.dataset.id).length;openSheet({type:'confirm',title:'グループを削除',msg:n?`このグループと、入っている ${n} 件の明細を削除します。元に戻せません。先に CSV で書き出しておくと安心です。`:'このグループを削除します。',yes:'delG',id:el.dataset.id,label:'削除する',danger:true})},
  delG(el){const id=el.dataset.id;xs().filter(e=>e.g===id).forEach(e=>gone(e.id,'x'));all('rec').filter(r=>r.tpl.g===id).forEach(r=>gone(r.id,'rec'));gone(id,'g');if(st.g===id)st.g='all';closeSheet();renderMain()},
  fg(el){st.g=el.dataset.id;renderMain()},
  fgGo(el){st.g=el.dataset.id;st.view='list';st.fcat='';st.fmon='';closeSheet();renderMain()},
  firr(){st.firr=!st.firr;renderMain()},
  fdel(){st.fdel=!st.fdel;renderMain()},
  catJump(el){st.view='list';st.g='all';st.fcat=el.dataset.id;st.fmon=st.month;st.q='';renderMain();window.scrollTo(0,0)},
  mon(el){st.month=addMonth(st.month,+el.dataset.n);renderMain()},
  setMonth(el){st.month=el.dataset.m;renderMain()},
  mcur(el){st.mcur=el.dataset.id;renderMain()},
  openMembers(){openSheet({type:'members'})},
  whoPick(el){st.sheet.who=el.dataset.id;$$('[data-act="whoPick"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===el.dataset.id))},
  bindMe(el){const c=conf();c.members=c.members.map(m=>m.id===el.dataset.id?Object.assign({},m,{uid:ses.user.id}):m);put('config','config',c);closeSheet();renderMain();onboard()},
  openBudget(){if(!conf())return;openSheet({type:'budget'})},
  openRecList(){openSheet({type:'recs'})},
  recTog(el){const r=get(el.dataset.id);put(r.id,'rec',Object.assign(r,{on:!r.on,next:!r.on&&r.next<todayStr()?todayStr():r.next}));renderSheet()},
  recDel(el){gone(el.dataset.id,'rec');renderSheet();renderMain()},
  openCats(el){if(!conf())return;openSheet({type:'cats',back:el?.dataset.back||''})},
  catDel(el){const c=conf();if(!c)return;c.catList=baseCats().filter(x=>x!==el.dataset.id);if(c.budget?.cats){c.budget=Object.assign({},c.budget,{cats:Object.assign({},c.budget.cats)});delete c.budget.cats[el.dataset.id]}put('config','config',c);renderSheet();renderMain()},
  openRates(){openSheet({type:'rates'})},
  async fetchRates(){try{const r=await fetch('https://api.frankfurter.dev/v1/latest?base=JPY&symbols='+Object.keys(CUR).filter(c=>c!=='JPY').join(','));const j=await r.json();Object.entries(j.rates||{}).forEach(([c,v])=>{const el=$('#rt_'+c);if(el&&v)el.value=String(Math.round(1/v*1000)/1000)});toast(`${j.date} 時点のレートを入れました。保存を押すと反映します`)}catch(e){toast('レートを取得できませんでした。手で入力してください')}},
  exportCSV(el){const l=live().filter(e=>(!el.dataset.g||e.g===el.dataset.g)&&(!el.dataset.m||e.date.slice(0,7)===el.dataset.m));if(!l.length)return toast('書き出す明細がありません');download(`wagayakakei_${el.dataset.m||(el.dataset.g?gname(el.dataset.g):'all')}_${todayStr()}.csv`,csvOf(l),'text/csv')},
  exportJSON(){const o={};docs.forEach((v,id)=>{if(v.k!=='receipt'&&v.k!=='act')o[id]=v});download(`wagayakakei_backup_${todayStr()}.json`,JSON.stringify({app:'wagayakakei',v:1,at:new Date().toISOString(),docs:o}),'application/json')},
  openImport(){openSheet({type:'imp'})},
  openRestore(){openSheet({type:'dump',title:'バックアップから戻す',msg:'バックアップの JSON ファイルを選ぶか、内容を貼り付けてください。同じ明細は上書きされ、それ以外は残ります。',input:true})},
  doRestore(){try{const j=JSON.parse($('#dumpT').value);if(j.app!=='wagayakakei'||!j.docs)throw 0;let n=0;for(const id in j.docs){const v=j.docs[id];if(v&&v.k&&v.d){put(id,v.k,v.d);n++}}closeSheet();renderMain();toast(`${n} 件を戻しました`)}catch(e){toast('バックアップの形式ではありません')}},
  async copyDump(){const t=$('#dumpT');try{await navigator.clipboard.writeText(t.value);toast('コピーしました')}catch(e){t.select();toast('選択しました。コピーしてください')}},
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){if(el.tagName==='BUTTON'&&el.type!=='submit')ev.preventDefault();f(el,ev)}});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){st.q=t.value;$('#xlist').innerHTML=listHTML();return}
  if(t.dataset.d&&st.sheet?.type==='edit'){const d=st.sheet.d,k=t.dataset.d;
    if(k==='inc')d.inc[t.dataset.m]=t.checked;else if(k==='v'||k==='paidS')d[k][t.dataset.m]=t.value;else if(k.startsWith('it.'))d.items[+t.dataset.i][k.slice(3)]=t.value;else d[k]=t.value;
    if(t.dataset.rr){if(k==='g'){const g=get(d.g);if(g?.cur)d.cur=g.cur}renderSheet()}else{const pv=$('#pv');if(pv)pv.innerHTML=previewHTML(d)}}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.f){st[t.dataset.f]=t.value;renderMain();return}
  if(t.dataset.s&&st.sheet?.type==='settle'){const s=st.sheet;s[t.dataset.s]=t.value;const n=s.mon?monthNet(s.mon,s.cur):(balances(live())[s.cur]||{}),w=whoOwes(n,s.cur);if(w){s.from=w.from;s.to=w.to;s.amtS=fromMinor(w.amt,s.cur)}renderSheet();return}
  if(t.id==='xImg'&&t.files[0]){shrink(t.files[0]).then(u=>{if(st.sheet?.type==='edit'){st.sheet.d.img=u;toast('写真を添付しました')}}).catch(()=>toast('この写真は読み込めませんでした'));return}
  if(t.id==='impFile'&&t.files[0]){const f=t.files[0];f.text().then(x=>readImport(x,f.name));return}
  if(t.id==='resFile'&&t.files[0]){t.files[0].text().then(x=>{$('#dumpT').value=x});return}
});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const id=ev.target.id;
  if(id==='xForm'){const d=st.sheet.d,c=draftCalc(d);if(c.err){toast(c.err);$('#pv')?.scrollIntoView({block:'center'});return}
    if(!d.g)return toast('グループを選んでください');
    const desc=d.desc.trim()||d.cat,base=d.src||{};
    const e=Object.assign({},base,{id:d.id||undefined,g:d.g,desc,amt:c.amt,cur:d.cur,date:d.date||todayStr(),cat:d.cat,paid:c.paid,sp:c.sp,owed:c.owed,note:d.note.trim(),cm:base.cm||[]});
    if(!d.id){delete e.at;delete e.by;delete e.rid;delete e.del;delete e.img}
    if(d.img)e.img=true;
    const saved=saveX(e,d.id?'edit':'add');
    if(d.img)put('r_'+saved.id,'receipt',{img:d.img});
    if(!d.id&&d.rep){put('rec_'+uid(),'rec',{every:d.rep,next:nextDate(saved.date,d.rep),on:true,tpl:{g:saved.g,desc,amt:c.amt,cur:d.cur,cat:d.cat,paid:c.paid,sp:c.sp,owed:c.owed,note:saved.note,by:me()}})}
    lsSet(NS+'-lastg',d.g);closeSheet();renderMain();toast(d.id?'保存しました':`追加しました（${MID().map(i=>nm(i)+' '+fmt(c.owed[i],d.cur)).join('／')}）`);return}
  if(id==='cmForm'){const t=$('#cmText').value.trim();if(!t)return;const e=get(st.sheet.id);e.cm=(e.cm||[]).concat([{by:me(),at:Date.now(),text:t}]);saveX(e,'cm');renderSheet();return}
  if(id==='payForm'){const s=st.sheet,cur=$('#payCur').value,amt=toMinor($('#payAmt').value,cur);if(!(amt>0))return toast('金額を入力してください');
    const g=$('#payG')?.value||s.g||liveGroups()[0]?.id||'';saveX({g,pay:true,desc:'精算',amt,cur,date:$('#payDate').value||todayStr(),cat:'精算',paid:{[s.from]:amt},owed:{[s.to]:amt},mon:$('#payMon').value||'',note:$('#payNote').value.trim(),cm:[]},'pay');closeSheet();renderMain();toast('精算を記録しました');return}
  if(id==='gForm'){const g=st.sheet.id?get(st.sheet.id):null,ids=MID(),r={};let s=0;for(const i of ids){r[i]=numOf($('#gR_'+i).value);s+=r[i]}if(!(Math.abs(s-100)<.001)||ids.some(i=>r[i]<0||isNaN(r[i])))return toast('比率の合計を 100% にしてください');
    const gid=g?.id||'g_'+uid();put(gid,'g',Object.assign({},g||{at:Date.now()},{name:$('#gName').value.trim(),type:$('#gType').value,cur:$('#gCur').value,ratio:r,wb:$('#gWb').value}));if(!g)lsSet(NS+'-lastg',gid);closeSheet();renderMain();toast(g?'保存しました':'グループを作りました');return}
  if(id==='memForm'){const first=st.sheet.type==='setup',ids=MID(),r={};let s=0;for(const i of ids){r[i]=numOf($('#mR_'+i).value);s+=r[i]}if(!(Math.abs(s-100)<.001)||ids.some(i=>r[i]<0||isNaN(r[i])))return toast('比率の合計を 100% にしてください');
    const c=conf()||{members:members(),rates:{}};c.members=members().map(m=>Object.assign({},m,{name:$('#mN_'+m.id).value.trim()||m.name}));c.ratio=r;
    if(first){const who=st.sheet.who||'a';c.members=c.members.map(m=>m.id===who?Object.assign({},m,{uid:ses.user.id}):m);const gn=$('#mG').value.trim();put('config','config',c);if(gn&&!groups().length)put('g_'+uid(),'g',{name:gn,type:'home',cur:'JPY',ratio:r,wb:'',at:Date.now()})}else put('config','config',c);
    st.sheet=null;render();toast('保存しました');return}
  if(id==='budForm'){const c=conf(),tot=toMinor($('#bd_total').value,'JPY')||0,cs={};let bad=tot<0;cats().forEach((n,k)=>{const v=toMinor($('#bd_c'+k).value,'JPY');if(v>0)cs[n]=v;else if(v<0)bad=true});if(bad)return toast('予算は 0 以上の数字で入力してください');
    c.budget={total:tot,cats:cs};put('config','config',c);closeSheet();renderMain();const sum=Object.values(cs).reduce((a,v)=>a+v,0);toast(tot&&sum>tot?`保存しました。項目の合計（${fmt(sum)}）が全体の予算を超えています`:'保存しました');return}
  if(id==='catForm'){const n=$('#catName').value.trim(),c=conf();if(!n||!c)return;if(baseCats().includes(n))return toast('同じ名前の項目があります');c.catList=baseCats().concat([n]);put('config','config',c);renderSheet();renderMain();return}
  if(id==='rateForm'){const c=conf();c.rates={};Object.keys(CUR).forEach(k=>{const v=numOf($('#rt_'+k)?.value||'');if(v>0)c.rates[k]=v});put('config','config',c);closeSheet();toast('保存しました');return}
  if(id==='impForm'){doImport();return}
  if(id==='setupForm'){cfg={url:$('#cfgUrl').value.trim(),key:$('#cfgKey').value.trim()};lsSet(CFG_KEY,cfg);st.authMsg='';st.screen='login';render();return}
  if(id==='loginForm'){const b=$('#lgBtn');b.disabled=true;b.textContent='ログイン中…';st.lastEmail=$('#lgEmail').value.trim();let err;try{err=await login(st.lastEmail,$('#lgPass').value)}catch(e){err='接続できませんでした。通信状況と接続先の設定を確認してください'}
    if(err){st.authMsg=err;st.authOk=false;render()}else{st.authMsg='';startApp()}return}
  if(id==='newpassForm'){const a=$('#np1').value;if(a!==$('#np2').value){st.authMsg='2つのパスワードが一致しません';st.authOk=false;return render()}const err=await setNewPassword(a).catch(()=> '接続できませんでした');if(err){st.authMsg=err;st.authOk=false;render()}else startApp()}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow();else persistNow()});
window.addEventListener('online',syncNow);window.addEventListener('pagehide',persistNow);
setInterval(()=>{if(document.visibilityState==='visible'&&st.screen==='app'&&!st.demo)syncNow()},20000);

async function boot(){
  applyTheme();
  if(!cfg)return startDemo();
  if(await handleAuthHash())return;
  if(ses)return startApp();
  st.screen='login';render();
}
window.__wagayakakeiTest={calcOwed,distribute};
boot();
})();
